name: HAZA AIOS — Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - feature/epic-10n-system-hardening
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-verification:
    name: Web Client Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Web TypeScript Verification
        run: npm run typecheck:web

      - name: Web Automated Test Suite
        run: npm run test:run -w apps/web

      - name: Web Production Build
        run: npm run build:web

  api-verification:
    name: API & Database Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test_root_password
          MYSQL_DATABASE: haza_aios_integration_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -ptest_root_password" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      NODE_ENV: test
      RUN_DB_INTEGRATION_TESTS: "true"
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3306
      DATABASE_NAME: haza_aios_integration_test
      TEST_DATABASE_NAME: haza_aios_integration_test
      DATABASE_USER: root
      DATABASE_PASSWORD: test_root_password
      DATABASE_POOL_LIMIT: 5
      LOG_LEVEL: error
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: API TypeScript Verification
        run: npm run typecheck:api

      - name: Database Schema Integrity Validation
        run: npm run db:check -w apps/api

      - name: Database Migrations Execution
        run: npm run db:migrate -w apps/api

      - name: API Automated & Integration Test Suite
        run: npm run test:api

      - name: API Production Build
        run: npm run build:api

  ci-status:
    name: CI Acceptance Status
    runs-on: ubuntu-latest
    needs: [web-verification, api-verification]
    if: always()
    steps:
      - name: Verify All Quality Gates Passed
        run: |
          if [ "${{ needs.web-verification.result }}" != "success" ] || [ "${{ needs.api-verification.result }}" != "success" ]; then
            echo "CI Quality Gates Failed!"
            echo "Web Verification: ${{ needs.web-verification.result }}"
            echo "API Verification: ${{ needs.api-verification.result }}"
            exit 1
          fi
          echo "All HAZA AIOS CI Quality Gates Passed Successfully."
